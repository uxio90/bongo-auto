name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    # The scripts use the Win32 API and the Windows registry, so they only import on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python -m unittest discover -s tests -v
